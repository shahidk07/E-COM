<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .search-wrapper{
            display:flex;align-items: center;justify-content: center;
        }
        input{
            height:50px;width:800px;border-radius:5px;
        }
        li{
            border:1px solid black;margin:10px;height:80px;width:1000px;font-size:3em;text-align: center;
        }
        ul{
            display: flex;justify-content:center;flex-direction: column;align-items: center;
        }
    </style>
  
</head>
<body>
<div class="search-wrapper">
    <input type="text" placeholder="search names" id="search" >
    <br>
</div>
<br>
<ul ID="myUL">
    <li><a>Fatima</a></li>
    <li><a>Shahid</a></li>
    <li><a>Shaima</a></li>
    <li><a>Hamza</a></li>
    <li><a>Aquib</a></li>
    <li><a>Faisal</a></li>
    <li><a>Ali</a></li>
</ul>
<script>
    function sfunc(){
        const filter = document.getElementById('search').value.toUpperCase();

        const store =document.getElementById("myUL");
        const sstore =store.getElementsByTagName("li"); 
         for(var i =0;i<sstore.length;i++)
         {
           var a= sstore[i].getElementsByTagName("a")[0];
           var b= a.innerHTML || a.textContent;
           if(b.toUpperCase().indexOf(filter)>-1)
           {
            sstore[i].style.display = "block";
           }
           else{
            sstore[i].style.display = "none";
           }
         }
    }
    const event =document.getElementById("search").addEventListener("input" , sfunc);
    </script>
</body>
</html>
