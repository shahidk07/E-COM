<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body style="background-image:url(https://depaulsvizag.com/rerimyce/2022/10/sportsday.jpg);margin:30px">
    <form style="background-color: rgba(0, 0, 0, 0.7); padding: 30px; width: 300px; height:600px; margin: auto; border-radius: 10px; color: aliceblue;">
        <h2 align="center">UPES SPORTS REGISTRATION</h2>
<label  for="name">
    Name

Address

<br>

    <br><br>

    <select id="age" name="age">
        <option VALUE="16">BTECH</option>
