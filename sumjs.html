<!DOCTYPE html>
<html>
    <head>
        <title>abcd
        </title>
    </head>
    <body>
        <h1>Addition of two Numbers</h1>
        Enter first number:<input id="a"></input><br>
        Enter second number<input id="b"></input>
        
        <h3>Result</h3>
        <button onclick="func1()">Calculate</button>

        <script type="text/javascript">
            function func1(){
                var fnum=document.getElementById("a").value;
                var gnum=document.getElementById("b").value;
                var total=parseInt(fnum) + parseInt(gnum);
                alert(total);
            }
        </script>
    </body>
</html>
