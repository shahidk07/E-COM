<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    .product-container {
      display: flex;
      justify-content: center;
      margin-top: 50px;
    }
    .product-card {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 300px;
      padding: 20px;
      text-align: center;
      margin: 0 10px;
    }
    .product-card img {
      width: 100%;
      border-radius: 8px;
    }
    .product-card h2 {
      margin: 20px 0;
    }
    .product-card p {
      color: #666;
      margin-bottom: 20px;
    }
    .product-card button {
      padding: 10px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .product-card button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <div class="product-container">
    <!-- Product 1: Laptop -->
    <div class="product-card" data-name="Laptop" data-price="500">
      <img src="https://via.placeholder.com/300" alt="Laptop">
      <h2>Laptop</h2>
      <p>$500</p>
      <button onclick="addToCart(this)">Add to Cart</button>
    </div>

    <!-- Product 2: CPU -->
    <div class="product-card" data-name="CPU" data-price="350">
      <img src="https://via.placeholder.com/300" alt="CPU">
      <h2>CPU</h2>
      <p>$350</p>
      <button onclick="addToCart(this)">Add to Cart</button>
    </div>

    <!-- Product 3: Keyboard -->
    <div class="product-card" data-name="Keyboard" data-price="5">
      <img src="https://via.placeholder.com/300" alt="Keyboard">
      <h2>Keyboard</h2>
      <p>$5</p>
      <button onclick="addToCart(this)">Add to Cart</button>
    </div>
  </div>

  <script>
    function addToCart(button) {
      // Retrieve the product name and price from the parent div (product-card)
      let productCard = button.closest('.product-card');
      let productName = productCard.getAttribute('data-name');
      let productPrice = parseFloat(productCard.getAttribute('data-price'));

      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.push({ name: productName, price: productPrice });
      localStorage.setItem('cart', JSON.stringify(cart));
      alert(`${productName} has been added to the cart!`);
    }
  </script>
</body>
</html>
