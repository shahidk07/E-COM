{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Shahid Store</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --navy: #14213d;
            --muted: #66758f;
            --cyan: #08b6d2;
            --blue: #2163ff;
            --border: #d9e1ec;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 20px;
            position: relative;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            color: var(--navy);
            background: radial-gradient(ellipse at 50% 50%, rgba(255,255,255,.94) 0%, rgba(239,250,255,.9) 44%, rgba(220,242,255,.96) 100%);
        }

        .background-shapes {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .shape { position: absolute; border-radius: 50%; pointer-events: none; }

        .shape-top-left {
            width: 590px; height: 590px; left: -210px; top: -220px;
            background: linear-gradient(135deg, rgba(46,158,255,.82), rgba(71,203,245,.30));
        }

        .shape-top-left::after {
            content: ""; position: absolute; inset: 0; border-radius: 50%;
            background: rgba(225,247,255,.36); transform: translate(65px, 70px);
        }

        .shape-right {
            width: 650px; height: 650px; right: -205px; top: 70px;
            background: linear-gradient(145deg, rgba(74,197,244,.20), rgba(40,142,255,.78));
        }

        .shape-right::after {
            content: ""; position: absolute; inset: 0; border-radius: 50%;
            background: rgba(255,255,255,.12); transform: translate(-95px, -45px);
        }

        .shape-bottom-left {
            width: 570px; height: 570px; left: -205px; bottom: -285px;
            background: linear-gradient(145deg, rgba(79,203,245,.32), rgba(42,143,255,.85));
        }

        .shape-bottom-right {
            width: 520px; height: 520px; right: -130px; bottom: -360px;
            background: linear-gradient(145deg, rgba(77,195,245,.22), rgba(36,124,255,.70));
        }

        .card {
            position: relative;
            z-index: 1;
            width: min(100%, 520px);
            margin: 16px auto;
            padding: 38px 42px 34px;
            border: 1px solid rgba(255,255,255,.94);
            border-radius: 21px;
            background: rgba(255,255,255,.95);
            box-shadow: 0 18px 50px rgba(49,137,201,.14);
        }

        .info-banner {
            padding: 14px 18px;
            margin-bottom: 24px;
            border: 1px solid #d8eafa;
            border-radius: 12px;
            background: #f2f9ff;
            color: var(--muted);
            text-align: center;
            font-size: .94rem;
            line-height: 1.55;
        }

        .info-banner strong { color: #168fe5; }

        .input-group { position: relative; margin-bottom: 14px; }

        .input-group svg {
            position: absolute;
            left: 17px;
            top: 50%;
            transform: translateY(-50%);
            color: #52627c;
            width: 20px;
            height: 20px;
            pointer-events: none;
        }

        .input-group input {
            display: block;
            width: 100%;
            height: 58px;
            padding: 0 18px 0 54px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            background: rgba(255,255,255,.8);
            color: var(--navy);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: .12em;
            outline: none;
            transition: border-color .2s, box-shadow .2s, background .2s;
        }

        .input-group input::placeholder {
            color: #718099;
            letter-spacing: .02em;
            font-weight: 400;
            font-size: .95rem;
        }

        .input-group input:focus {
            border-color: #2397ff;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(35,151,255,.12);
        }

        .resend-row { text-align: center; margin-bottom: 22px; }

        .resend-row a {
            color: #078fdf;
            font-size: .92rem;
            font-weight: 600;
            text-decoration: none;
            transition: color .2s;
        }

        .resend-row a:hover { color: #164bdb; }

        .btn-submit {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            min-height: 58px;
            padding: 14px 20px;
            border: 0;
            border-radius: 13px;
            background: linear-gradient(100deg, var(--cyan) 0%, #078fe9 52%, var(--blue) 100%);
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 7px 16px rgba(28,133,237,.12);
            transition: transform .18s, box-shadow .18s, filter .18s;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 22px rgba(28,133,237,.2);
            filter: saturate(1.05);
        }

        .timer-text {
            margin-top: 18px;
            color: #718099;
            text-align: center;
            font-size: .84rem;
            line-height: 1.5;
        }

        .timer-text span { color: #168fe5; font-weight: 700; }

        .error-msg {
            padding: 11px 14px;
            margin-bottom: 16px;
            border: 1px solid #ffd1cc;
            border-radius: 9px;
            background: #fff1f0;
            color: #b42318;
            font-size: .88rem;
            line-height: 1.45;
            text-align: center;
        }

        @media (max-width: 600px) {
            body { padding: 20px 14px; overflow-y: auto; }
            .card { padding: 30px 22px 27px; border-radius: 18px; }
            .shape-top-left { width: 390px; height: 390px; left: -230px; top: -170px; }
            .shape-right { width: 390px; height: 390px; right: -260px; top: 30%; }
            .shape-bottom-left { width: 330px; height: 330px; left: -200px; bottom: -190px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <div class="background-shapes" aria-hidden="true">
        <div class="shape shape-top-left"></div>
        <div class="shape shape-right"></div>
        <div class="shape shape-bottom-left"></div>
        <div class="shape shape-bottom-right"></div>
    </div>

    <main class="card">
        <div class="info-banner">
            Enter the <strong>OTP</strong> we sent to your email address.
        </div>

        {% if error %}
        <div class="error-msg" role="alert">{{ error }}</div>
        {% endif %}

        <form action="/verify/" method="POST">
            {% csrf_token %}

            <div class="input-group">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input
                    type="text"
                    name="otp"
                    id="otpInput"
                    placeholder="Enter OTP"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    autocomplete="one-time-code"
                    inputmode="numeric"
                    aria-label="6-digit verification code"
                    required
                    autofocus
                >
            </div>

            <div class="resend-row">
                <a href="/signup/">Resend OTP</a>
            </div>

            <button type="submit" class="btn-submit">Submit OTP</button>
        </form>

        <div class="timer-text">
            OTP expires in <span id="timer">10:00</span>
        </div>
    </main>

    <script>
        const otpInput = document.getElementById('otpInput');

        otpInput.addEventListener('input', function () {
            this.value = this.value.replace(/\D/g, '').slice(0, 6);
        });

        let seconds = 10 * 60;
        const timerEl = document.getElementById('timer');

        const countdown = setInterval(() => {
            seconds--;

            if (seconds <= 0) {
                clearInterval(countdown);
                timerEl.textContent = 'Expired';
                timerEl.style.color = '#b42318';
                return;
            }

            const minutes = Math.floor(seconds / 60).toString().padStart(2, '0');
            const remainingSeconds = (seconds % 60).toString().padStart(2, '0');
            timerEl.textContent = `${minutes}:${remainingSeconds}`;
        }, 1000);
    </script>
</body>
</html>
