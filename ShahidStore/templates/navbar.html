{% load static %}
<!-- Unified Site Navbar -->
<nav class="bg-white shadow-sm border-b sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">

        <!-- Brand Logo / Name -->
        <a href="/" class="flex items-center gap-3">
            <img
                src="{% static 'images/brandlogo.png' %}"
                alt="Shahid Store"
                class="h-10 w-auto object-contain"
                onerror="this.style.display='none'">
            <span class="text-2xl font-bold tracking-tight">
                <span class="text-slate-900">Shahid</span>
                <span class="text-cyan-600">Store</span>
            </span>
        </a>

        <!-- Center Navigation Links -->
        <div class="hidden md:flex items-center gap-8 text-[15px] font-medium text-slate-600">
            <a href="/" class="hover:text-cyan-600 transition">Home</a>
            <a href="/catalog/" class="hover:text-cyan-600 transition">Products</a>
            <a href="/aboutus/" class="hover:text-cyan-600 transition">About Us</a>
            <a href="/contact-us/" class="hover:text-cyan-600 transition">Contact</a>
        </div>

        <!-- Right Side Actions -->
        <div class="flex items-center gap-3 text-sm font-medium">
            <a href="/cart/" class="flex items-center gap-1.5 text-slate-700 hover:text-cyan-600 px-3 py-2 rounded-lg hover:bg-slate-100 transition">
                <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
                </svg>
                <span>Cart</span>
            </a>

            {% if request.session.is_authenticated %}
            <a href="/orders/" class="hidden sm:inline-block text-slate-700 hover:text-cyan-600 px-3 py-2 rounded-lg hover:bg-slate-100 transition">
                Orders
            </a>
            <a href="/profile/" class="text-slate-700 hover:text-cyan-600 px-3 py-2 rounded-lg hover:bg-slate-100 transition">
                Profile
            </a>
            <a href="/logout/">
                <button type="button" class="px-4 py-2 bg-rose-600 text-white rounded-lg hover:bg-rose-700 transition font-medium text-sm shadow-sm">
                    Logout
                </button>
            </a>
            {% else %}
            <a href="/signin/">
                <button type="button" class="px-4 py-2 bg-cyan-600 text-white rounded-lg hover:bg-cyan-700 transition font-medium text-sm shadow-sm">
                    Login
                </button>
            </a>
            <a href="/signup/" class="hidden sm:inline-block">
                <button type="button" class="px-4 py-2 border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-100 transition font-medium text-sm">
                    Sign Up
                </button>
            </a>
            {% endif %}
        </div>

    </div>
</nav>
