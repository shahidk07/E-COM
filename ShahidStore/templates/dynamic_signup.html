{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Shahid Store</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0010;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* TUNNEL */
        .tunnel {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, #1a003a 0%, #0a0010 70%);
            overflow: hidden;
        }
        .tunnel::before, .tunnel::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                repeating-conic-gradient(from 0deg at 50% 50%,
                    transparent 0deg, transparent 2deg,
                    rgba(200, 0, 255, 0.07) 2deg, rgba(200, 0, 255, 0.07) 3deg);
            animation: tunnelSpin 12s linear infinite;
        }
        .tunnel::after {
            background-image:
                repeating-conic-gradient(from 0deg at 50% 50%,
                    transparent 0deg, transparent 4deg,
                    rgba(255, 0, 180, 0.06) 4deg, rgba(255, 0, 180, 0.06) 5deg);
            animation: tunnelSpin 18s linear infinite reverse;
        }
        @keyframes tunnelSpin { to { transform: rotate(360deg); } }

        .streaks { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
        .streak {
            position: absolute;
            height: 2px;
            border-radius: 2px;
            animation: shootStreak linear infinite;
            opacity: 0;
        }
        @keyframes shootStreak {
            0%   { opacity: 0; transform: translateX(-120%) rotate(var(--angle)); }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { opacity: 0; transform: translateX(250%) rotate(var(--angle)); }
        }

        /* CARD */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(10, 0, 25, 0.75);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(180, 0, 255, 0.35);
            border-radius: 18px;
            padding: 44px 44px 40px;
            width: 100%;
            max-width: 700px;
            box-shadow:
                0 0 0 1px rgba(255, 0, 200, 0.15),
                0 0 60px rgba(160, 0, 255, 0.2),
                0 24px 64px rgba(0,0,0,0.6);
            margin: 24px;
        }

        .title {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            color: #fff;
            margin-bottom: 6px;
        }
        .title span {
            background: linear-gradient(90deg, #e040fb, #7c4dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .title-underline {
            width: 48px;
            height: 3px;
            background: linear-gradient(90deg, #e040fb, #7c4dff);
            border-radius: 2px;
            margin: 0 auto 28px;
        }

        /* FORM GRID */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 14px;
        }
        .form-grid .full { grid-column: 1 / -1; }

        .input-group { position: relative; }
        .input-group svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(200, 120, 255, 0.7);
            width: 18px;
            height: 18px;
            pointer-events: none;
        }
        .input-group input {
            width: 100%;
            padding: 13px 44px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(180, 0, 255, 0.25);
            border-radius: 10px;
            color: #fff;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        .input-group input::placeholder { color: rgba(200, 160, 255, 0.5); }
        .input-group input:focus {
            border-color: rgba(200, 0, 255, 0.7);
            background: rgba(255, 255, 255, 0.08);
        }
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(200, 120, 255, 0.6);
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .toggle-password svg { width: 18px; height: 18px; }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #e040fb, #7c4dff);
            border: none;
            border-radius: 50px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 6px;
        }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }

        .bottom-text {
            text-align: center;
            font-size: 0.87rem;
            color: rgba(220, 200, 255, 0.7);
            margin-top: 18px;
        }
        .bottom-text a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 600;
        }
        .bottom-text a:hover { color: #e040fb; }

        .error-msg {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            border-radius: 8px;
            padding: 10px 14px;
            color: #fca5a5;
            font-size: 0.85rem;
            margin-bottom: 16px;
            text-align: center;
            grid-column: 1 / -1;
        }

        @media (max-width: 540px) {
            .form-grid { grid-template-columns: 1fr; }
            .card { padding: 32px 20px; }
        }
    </style>
</head>
<body>

    <div class="tunnel"></div>
    <div class="streaks" id="streaks"></div>

    <div class="card">
        <h1 class="title">CREATE AN <span>ACCOUNT</span></h1>
        <div class="title-underline"></div>

        <form action="/signup/" method="POST">
            {% csrf_token %}
            <div class="form-grid">

                {% if message %}
                <div class="error-msg">{{ message }}</div>
                {% endif %}

                <!-- First Name -->
                <div class="input-group">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input type="text" name="first_name" placeholder="First Name" required autocomplete="given-name">
                </div>

                <!-- Last Name -->
                <div class="input-group">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input type="text" name="last_name" placeholder="Last Name" required autocomplete="family-name">
                </div>

                <!-- Email -->
                <div class="input-group">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                    </svg>
                    <input type="email" name="email" placeholder="Email" required autocomplete="email">
                </div>

                <!-- Password -->
                <div class="input-group">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="pass1" name="password" placeholder="Password" required autocomplete="new-password">
                    <button type="button" class="toggle-password" onclick="togglePass('pass1',this)">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>

                <!-- Confirm Password -->
                <div class="input-group full">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="pass2" name="confirm_password" placeholder="Confirm Password" required autocomplete="new-password">
                    <button type="button" class="toggle-password" onclick="togglePass('pass2',this)">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>

            </div>

            <button type="submit" class="btn-submit">
                CREATE ACCOUNT
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </button>
        </form>

        <div class="bottom-text">Already have an account? <a href="/signin/">Login</a></div>
    </div>

    <script>
        function togglePass(id, btn) {
            const input = document.getElementById(id);
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            btn.innerHTML = isHidden
                ? `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`
                : `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
        }

        const streakContainer = document.getElementById('streaks');
        const colors = ['#ff00cc', '#cc00ff', '#6600ff', '#ff0080', '#00ccff', '#aa00ff'];
        for (let i = 0; i < 80; i++) {
            const s = document.createElement('div');
            s.className = 'streak';
            const color = colors[Math.floor(Math.random() * colors.length)];
            const len = Math.random() * 180 + 40;
            s.style.cssText = `
                --angle: ${(Math.random() - 0.5) * 40}deg;
                top: ${Math.random() * 120 - 10}%;
                left: ${Math.random() * 100}%;
                width: ${len}px;
                background: linear-gradient(90deg, transparent, ${color}, transparent);
                box-shadow: 0 0 6px ${color};
                animation-duration: ${Math.random() * 3 + 2}s;
                animation-delay: ${Math.random() * 6}s;
            `;
            streakContainer.appendChild(s);
        }
    </script>
</body>
</html>
