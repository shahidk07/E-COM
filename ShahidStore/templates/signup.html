{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{  margin: 0;padding: 0; box-sizing: border-box;font-family: sans-serif; }
        body { width: 100vw;height: 100vh;   display: flex;align-items: center; justify-content: center; }
        #background-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        form { background-color: rgba(0, 0, 0,0.5);
            height: 550px;
            width: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border-radius: 15px; }
        h2 {color: aliceblue; text-transform: uppercase;  padding: 10px 0; font-size: 2em;
        }
        .form-group { border-bottom: 3px solid white;  width: 330px;margin: 30px 0; }
        .form-group input {
            width: 100%;
            height: 40px;
            background-color: transparent;
            border: none;
            outline: none;
            color: #fff; }
        p { margin-top: 10px;
            color: white; text-align: center;
            padding: 10px; }
        .form-group input::placeholder {
    color: white;
    opacity: 3s;}
        button{border: none;
            transition:background-color 1s ease ;
        height:45px;
    width:70%;
font-size:1.5em;
text-transform: uppercase;
border-radius: 20px;
}
button:active {background-color:dodgerblue


}

    </style>
</head>
<body style="background: none;">
    <video autoplay muted loop id="background-video">
        <source src="{% static 'videos/login.mp4' %}" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <form action="/signup/" method="post" name="form">
         {% csrf_token %}
        <h2>CREATE AN ACCOUNT</h2>
        <div class="form-group">
            <input type="text" placeholder="Fist Name" name="first_name" required>
        </div>
        <div class="form-group">
            <input type="text" placeholder="Last Name" name="last_name" required>
        </div>
        <div class="form-group">
            <input type="password" placeholder="Password" name="password" required>
        </div>
        <div class="form-group">
            <input type="text" placeholder="Email" name="email" required>
        </div>

        <p><input type="checkbox"> Remember me </p>
        <button type="submit" id="submit">Send OTP</button>
        <p>Already Registered?<a href='/signin/'>Login</a></p>
    </form>

</body>
</html>
