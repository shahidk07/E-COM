{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Shahid Store</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0010;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ── NEON TUNNEL BACKGROUND ── */
        .tunnel {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, #1a003a 0%, #0a0010 70%);
            overflow: hidden;
        }

        .tunnel::before, .tunnel::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                repeating-conic-gradient(from 0deg at 50% 50%,
                    transparent 0deg, transparent 2deg,
                    rgba(200, 0, 255, 0.07) 2deg, rgba(200, 0, 255, 0.07) 3deg);
            animation: tunnelSpin 12s linear infinite;
        }
        .tunnel::after {
            background-image:
                repeating-conic-gradient(from 0deg at 50% 50%,
                    transparent 0deg, transparent 4deg,
                    rgba(255, 0, 180, 0.06) 4deg, rgba(255, 0, 180, 0.06) 5deg);
            animation: tunnelSpin 18s linear infinite reverse;
        }

        @keyframes tunnelSpin {
            to { transform: rotate(360deg); }
        }

        /* Neon streak particles */
        .streaks {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .streak {
            position: absolute;
            height: 2px;
            border-radius: 2px;
            animation: shootStreak linear infinite;
            opacity: 0;
        }

        @keyframes shootStreak {
            0%   { opacity: 0; transform: translateX(-120%) translateY(0) rotate(var(--angle)); }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { opacity: 0; transform: translateX(250%) translateY(0) rotate(var(--angle)); }
        }

        /* Card */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(10, 0, 25, 0.75);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(180, 0, 255, 0.35);
            border-radius: 18px;
            padding: 48px 44px;
            width: 100%;
            max-width: 440px;
            box-shadow:
                0 0 0 1px rgba(255, 0, 200, 0.15),
                0 0 60px rgba(160, 0, 255, 0.2),
                0 24px 64px rgba(0,0,0,0.6);
        }

        /* Title */
        .title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            color: #fff;
            margin-bottom: 6px;
        }
        .title span {
            background: linear-gradient(90deg, #e040fb, #7c4dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .title-underline {
            width: 48px;
            height: 3px;
            background: linear-gradient(90deg, #e040fb, #7c4dff);
            border-radius: 2px;
            margin: 0 auto 32px;
        }

        /* Input groups */
        .input-group {
            position: relative;
            margin-bottom: 16px;
        }
        .input-group svg, .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(200, 120, 255, 0.7);
            width: 18px;
            height: 18px;
            pointer-events: none;
        }
        .input-group input {
            width: 100%;
            padding: 14px 44px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(180, 0, 255, 0.25);
            border-radius: 10px;
            color: #fff;
            font-size: 0.92rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        .input-group input::placeholder { color: rgba(200, 160, 255, 0.5); }
        .input-group input:focus {
            border-color: rgba(200, 0, 255, 0.7);
            background: rgba(255, 255, 255, 0.08);
        }
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(200, 120, 255, 0.6);
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .toggle-password svg { width: 18px; height: 18px; }

        /* Options row */
        .options-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }
        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: rgba(220,200,255,0.8);
        }
        .remember input[type="checkbox"] {
            width: 15px; height: 15px;
            accent-color: #c040fb;
        }
        .forgot {
            font-size: 0.85rem;
            color: #a78bfa;
            text-decoration: none;
            transition: color 0.2s;
        }
        .forgot:hover { color: #e040fb; }

        /* Submit button */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #e040fb, #7c4dff);
            border: none;
            border-radius: 50px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-submit:active { transform: translateY(0); opacity: 1; }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0 16px;
            color: rgba(200, 160, 255, 0.4);
            font-size: 0.78rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(180, 0, 255, 0.2);
        }

        /* Bottom link */
        .bottom-text {
            text-align: center;
            font-size: 0.87rem;
            color: rgba(220, 200, 255, 0.7);
        }
        .bottom-text a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        .bottom-text a:hover { color: #e040fb; }

        /* Error message */
        .error-msg {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            border-radius: 8px;
            padding: 10px 14px;
            color: #fca5a5;
            font-size: 0.85rem;
            margin-bottom: 16px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Neon tunnel background -->
    <div class="tunnel"></div>
    <div class="streaks" id="streaks"></div>

    <!-- Login Card -->
    <div class="card">
        <h1 class="title">LOG<span>IN</span></h1>
        <div class="title-underline"></div>

        {% if message %}
        <div class="error-msg">{{ message }}</div>
        {% endif %}

        <form action="/signin/" method="POST">
            {% csrf_token %}

            <!-- Email -->
            <div class="input-group">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                </svg>
                <input type="email" name="email" placeholder="Email" required autocomplete="email">
            </div>

            <!-- Password -->
            <div class="input-group">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input type="password" id="loginPassword" name="password" placeholder="Password" required>
                <button type="button" class="toggle-password" onclick="togglePass('loginPassword', this)">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                </button>
            </div>

            <!-- Options -->
            <div class="options-row">
                <label class="remember">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-submit">
                LOGIN
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </button>
        </form>

        <div class="divider">OR</div>
        <div class="bottom-text">Don't have an account? <a href="/signup/">Register</a></div>
    </div>

    <script>
        /* Password toggle */
        function togglePass(id, btn) {
            const input = document.getElementById(id);
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            btn.innerHTML = isHidden
                ? `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`
                : `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
        }

        /* Generate neon streaks */
        const streakContainer = document.getElementById('streaks');
        const colors = ['#ff00cc', '#cc00ff', '#6600ff', '#ff0080', '#00ccff', '#aa00ff'];

        for (let i = 0; i < 80; i++) {
            const s = document.createElement('div');
            s.className = 'streak';
            const angle = (Math.random() - 0.5) * 40;
            const color = colors[Math.floor(Math.random() * colors.length)];
            const len = Math.random() * 180 + 40;
            const top = Math.random() * 120 - 10;
            const delay = Math.random() * 6;
            const dur = Math.random() * 3 + 2;
            s.style.cssText = `
                --angle: ${angle}deg;
                top: ${top}%;
                left: ${Math.random() * 100}%;
                width: ${len}px;
                background: linear-gradient(90deg, transparent, ${color}, transparent);
                box-shadow: 0 0 6px ${color};
                animation-duration: ${dur}s;
                animation-delay: ${delay}s;
            `;
            streakContainer.appendChild(s);
        }
    </script>
</body>
</html>
