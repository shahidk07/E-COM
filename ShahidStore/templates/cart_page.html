<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50">

<!-- Navbar -->
<nav class="bg-white border-b shadow-sm">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">

        <h1 class="text-3xl font-bold">
            <span class="text-black">Shahid</span>
            <span class="text-cyan-600">Store</span>
        </h1>

        <a href="/products"
           class="text-cyan-600 hover:underline">
            Continue Shopping
        </a>

    </div>
</nav>

<div class="max-w-7xl mx-auto px-6 py-10">

    <h2 class="text-4xl font-bold mb-8">
        Shopping Cart
    </h2>

    <div class="grid lg:grid-cols-3 gap-8">

        <!-- Cart Items -->
        <div class="lg:col-span-2 space-y-6">

            <!-- Cart Item -->
            <div class="bg-white rounded-xl shadow-sm p-5 flex gap-5">

                <img
                    src="https://via.placeholder.com/120"
                    class="w-28 h-28 rounded-lg object-cover">

                <div class="flex-1">

                    <h3 class="text-xl font-semibold">
                        Sample Product
                    </h3>

                    <p class="text-gray-500 mt-2">
                        ₹999
                    </p>

                    <div class="flex items-center gap-3 mt-5">

                        <button class="border rounded px-3 py-1">
                            -
                        </button>

                        <span>1</span>

                        <button class="border rounded px-3 py-1">
                            +
                        </button>

                    </div>

                </div>

                <div class="text-right">

                    <p class="font-semibold text-lg">
                        ₹999
                    </p>

                    <button
                        class="text-red-500 mt-8 hover:underline">
                        Remove
                    </button>

                </div>

            </div>

            <!-- Another Item -->
            <div class="bg-white rounded-xl shadow-sm p-5 flex gap-5">

                <img
                    src="https://via.placeholder.com/120"
                    class="w-28 h-28 rounded-lg object-cover">

                <div class="flex-1">

                    <h3 class="text-xl font-semibold">
                        Another Product
                    </h3>

                    <p class="text-gray-500 mt-2">
                        ₹499
                    </p>

                    <div class="flex items-center gap-3 mt-5">

                        <button class="border rounded px-3 py-1">
                            -
                        </button>

                        <span>2</span>

                        <button class="border rounded px-3 py-1">
                            +
                        </button>

                    </div>

                </div>

                <div class="text-right">

                    <p class="font-semibold text-lg">
                        ₹998
                    </p>

                    <button
                        class="text-red-500 mt-8 hover:underline">
                        Remove
                    </button>

                </div>

            </div>

        </div>

        <!-- Order Summary -->
        <div>

            <div class="bg-white rounded-xl shadow-sm p-6 sticky top-6">

                <h3 class="text-2xl font-bold mb-6">
                    Order Summary
                </h3>

                <div class="space-y-3">

                    <div class="flex justify-between">
                        <span>Subtotal</span>
                        <span>₹1,997</span>
                    </div>

                    <div class="flex justify-between">
                        <span>Delivery</span>
                        <span class="text-green-600">
                            Free
                        </span>
                    </div>

                    <hr>

                    <div class="flex justify-between text-xl font-bold">
                        <span>Total</span>
                        <span>₹1,997</span>
                    </div>

                </div>

                <button
                    class="w-full mt-8 bg-cyan-600 text-white py-4 rounded-xl hover:bg-cyan-700">

                    Proceed to Checkout

                </button>

            </div>

        </div>

    </div>

</div>

</body>
</html>
