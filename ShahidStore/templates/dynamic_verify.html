{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Shahid Store</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0010;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* TUNNEL */
        .tunnel {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, #1a003a 0%, #0a0010 70%);
            overflow: hidden;
        }
        .tunnel::before, .tunnel::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                repeating-conic-gradient(from 0deg at 50% 50%,
                    transparent 0deg, transparent 2deg,
                    rgba(200, 0, 255, 0.07) 2deg, rgba(200, 0, 255, 0.07) 3deg);
            animation: tunnelSpin 12s linear infinite;
        }
        .tunnel::after {
            background-image:
                repeating-conic-gradient(from 0deg at 50% 50%,
                    transparent 0deg, transparent 4deg,
                    rgba(255, 0, 180, 0.06) 4deg, rgba(255, 0, 180, 0.06) 5deg);
            animation: tunnelSpin 18s linear infinite reverse;
        }
        @keyframes tunnelSpin { to { transform: rotate(360deg); } }

        .streaks { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
        .streak {
            position: absolute;
            height: 2px;
            border-radius: 2px;
            animation: shootStreak linear infinite;
            opacity: 0;
        }
        @keyframes shootStreak {
            0%   { opacity: 0; transform: translateX(-120%) rotate(var(--angle)); }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { opacity: 0; transform: translateX(250%) rotate(var(--angle)); }
        }

        /* CARD */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(10, 0, 25, 0.75);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(180, 0, 255, 0.35);
            border-radius: 18px;
            padding: 44px 44px 40px;
            width: 100%;
            max-width: 520px;
            box-shadow:
                0 0 0 1px rgba(255, 0, 200, 0.15),
                0 0 60px rgba(160, 0, 255, 0.2),
                0 24px 64px rgba(0,0,0,0.6);
            margin: 24px;
        }

        /* Info banner */
        .info-banner {
            background: rgba(200, 0, 255, 0.1);
            border: 1px solid rgba(200, 0, 255, 0.25);
            border-radius: 10px;
            padding: 14px 18px;
            text-align: center;
            color: rgba(220, 180, 255, 0.9);
            font-size: 0.92rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .info-banner strong {
            color: #e040fb;
        }

        /* OTP input group */
        .input-group {
            position: relative;
            margin-bottom: 12px;
        }
        .input-group svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(200, 120, 255, 0.7);
            width: 18px;
            height: 18px;
            pointer-events: none;
        }
        .input-group input {
            width: 100%;
            padding: 16px 44px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(180, 0, 255, 0.4);
            border-radius: 10px;
            color: #fff;
            font-size: 1.05rem;
            font-family: inherit;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-align: center;
            outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }
        .input-group input::placeholder {
            color: rgba(200, 160, 255, 0.4);
            letter-spacing: 0.05em;
            font-weight: 400;
            font-size: 0.9rem;
        }
        .input-group input:focus {
            border-color: rgba(200, 0, 255, 0.8);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(200, 0, 255, 0.2);
        }

        /* Resend OTP */
        .resend-row {
            text-align: center;
            margin-bottom: 22px;
        }
        .resend-row a {
            color: #a78bfa;
            font-size: 0.88rem;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s;
        }
        .resend-row a:hover { color: #e040fb; }

        /* Submit */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #e040fb, #7c4dff);
            border: none;
            border-radius: 50px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-submit:active { transform: translateY(0); }

        /* Timer */
        .timer-text {
            text-align: center;
            font-size: 0.8rem;
            color: rgba(200, 160, 255, 0.5);
            margin-top: 16px;
        }
        .timer-text span {
            color: #e040fb;
            font-weight: 600;
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            border-radius: 8px;
            padding: 10px 14px;
            color: #fca5a5;
            font-size: 0.85rem;
            margin-bottom: 16px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="tunnel"></div>
    <div class="streaks" id="streaks"></div>

    <div class="card">
        <!-- Info Banner -->
        <div class="info-banner">
            Enter the <strong>OTP</strong> we sent to your email id.
        </div>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form action="/verify/" method="POST">
            {% csrf_token %}

            <!-- OTP Input -->
            <div class="input-group">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input type="text" name="otp" id="otpInput" placeholder="Enter OTP" maxlength="6"
                    autocomplete="one-time-code" inputmode="numeric" required autofocus>
            </div>

            <!-- Resend -->
            <div class="resend-row">
                <a href="/signup/">Resend OTP</a>
            </div>

            <button type="submit" class="btn-submit">
                Submit OTP
            </button>
        </form>

        <!-- Countdown Timer -->
        <div class="timer-text">
            OTP expires in <span id="timer">10:00</span>
        </div>
    </div>

    <script>
        /* Neon streaks */
        const streakContainer = document.getElementById('streaks');
        const colors = ['#ff00cc', '#cc00ff', '#6600ff', '#ff0080', '#00ccff', '#aa00ff'];
        for (let i = 0; i < 80; i++) {
            const s = document.createElement('div');
            s.className = 'streak';
            const color = colors[Math.floor(Math.random() * colors.length)];
            const len = Math.random() * 180 + 40;
            s.style.cssText = `
                --angle: ${(Math.random() - 0.5) * 40}deg;
                top: ${Math.random() * 120 - 10}%;
                left: ${Math.random() * 100}%;
                width: ${len}px;
                background: linear-gradient(90deg, transparent, ${color}, transparent);
                box-shadow: 0 0 6px ${color};
                animation-duration: ${Math.random() * 3 + 2}s;
                animation-delay: ${Math.random() * 6}s;
            `;
            streakContainer.appendChild(s);
        }

        /* Only allow digits */
        document.getElementById('otpInput').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
        });

        /* Countdown timer 10 minutes */
        let seconds = 10 * 60;
        const timerEl = document.getElementById('timer');
        const countdown = setInterval(() => {
            seconds--;
            if (seconds <= 0) {
                clearInterval(countdown);
                timerEl.textContent = 'Expired';
                timerEl.style.color = '#f87171';
                return;
            }
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            timerEl.textContent = `${m}:${s}`;
        }, 1000);
    </script>
</body>
</html>
